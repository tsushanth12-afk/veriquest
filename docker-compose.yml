# ==========================================================================
# VeriQuest — Docker Compose (Development)
# ==========================================================================

services:
  # Redis for Celery broker
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      # Separate ignored runtime env files; never share the other service's SQL password.
      - path: .env.api.local
        required: false
    environment:
      - DATABASE_URL=${API_DATABASE_URL:?Provide the private vq_api database configuration}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis
    restart: unless-stopped

  # Celery Worker (HDL execution)
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${WORKER_DATABASE_URL:?Provide the private vq_worker database configuration}
    env_file:
      - path: .env.worker.local
        required: false
    depends_on:
      - redis
    volumes:
      # Mount Docker socket so worker can spawn execution containers
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Build the Icarus Verilog execution image
  icarus-build:
    build:
      context: ./execution
      dockerfile: Dockerfile
    image: veriquest-icarus:latest
    entrypoint: ["echo", "Icarus image built"]

volumes:
  redis_data:
