name: VeriQuest CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # 1. Frontend: Lint, Security & Invariant Tests, Typecheck, and Production Build
  # ==========================================================================
  frontend-ci:
    name: Frontend Quality & Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Run Oxlint Quality Checks
        run: npm run lint

      - name: Run Security & Invariant Test Suite
        run: npm test

      - name: TypeScript Validation & Production Build
        run: npm run build

  # ==========================================================================
  # 2. Backend: Lint, Unit Tests, and Contract Verification
  # ==========================================================================
  backend-ci:
    name: Backend Pytest & Schema Isolation Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Pytest Test Suite
        run: |
          PYTHONPATH=backend:worker pytest backend/tests -v

  # ==========================================================================
  # 3. Security & Invariant Gate: Secrets and Schemas Verification
  # ==========================================================================
  security-gate:
    name: Architecture & Secret Leakage Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify No Secrets in Frontend Bundles
        run: |
          # Assert official_solution and hidden_testbench are not in public types
          if grep -q "official_solution" src/types/challenge.ts; then
            echo "ERROR: official_solution found in public challenge types!"
            exit 1
          fi
          if grep -q "hidden_testbench" src/types/challenge.ts; then
            echo "ERROR: hidden_testbench found in public challenge types!"
            exit 1
          fi
          echo "Secret fields verified strictly absent from student types."

      - name: Verify SQL Migration Check Constraints
        run: |
          # Ensure published check constraint and re-validation triggers exist
          grep -q "published_requires_published_status" supabase/migrations/001_initial_schema.sql
          grep -q "on_secret_changed_invalidate" supabase/migrations/001_initial_schema.sql
          echo "Database schema invariants verified."
